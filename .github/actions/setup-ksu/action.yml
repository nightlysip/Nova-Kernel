name: KernelSU integration
description: Integrate KernelSU-Next without compiling the kernel.
runs:
  using: composite
  steps:
    - name: 🧩 Prepare KernelSU
      shell: bash
      run: |
        set -euo pipefail
        cd "$GITHUB_WORKSPACE"

        REPO="${KSU_REPO:-https://github.com/KernelSU-Next/KernelSU-Next.git}"
        BRANCH="legacy"
        COMMIT_SHA="9cb2efabce93346468ed3a525750a8e970afe3cd"

        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "🧩 KernelSU integration"
        echo "Repository: ${REPO}"
        echo "Branch    : ${BRANCH}"
        echo "Commit    : ${COMMIT_SHA}"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

        rm -rf KernelSU
        echo "Running KernelSU setup script..."
        curl -fsSL --retry 3 "${KSU_SETUP_URL:?KSU_SETUP_URL is required}" | bash -

        rm -rf KernelSU
        git clone --depth=1 --filter=blob:none --single-branch -b "$BRANCH" "$REPO" KernelSU

        # Pinned commit, so a new legacy head cannot silently change the build
        git -C KernelSU fetch --depth=1 origin "$COMMIT_SHA"
        git -C KernelSU checkout -q "$COMMIT_SHA"

        echo "✅ KernelSU integration finished"
        echo "ℹ️  This step intentionally does not run make."
